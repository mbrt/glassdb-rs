# The settings of the timing file of each case of the CI comparison: the
# settings of its counter file, with a window of 300 s. The CI comparison runs
# it with latency jitter, so that its percentiles are realistic, in 32 runs. In
# one run, the spread of a p90 is at most about 0.9% at 300 s, and it falls with
# the square root of the window. Other experiments with the tag `ci/timing`
# have their own settings.
include = ["default.toml"]

[cell.measure]
duration = "300s"
max-duration = "300s"

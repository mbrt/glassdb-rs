# The body of the `stale-reads-shared-leaves`, `stale-reads-single`, and
# `stale-reads-view` experiments: stale read-only transactions
# (`StaleDatabaseView::read_tx`) of one and of ten keys, and a writer, on the
# same leaves of one collection.
# Each write gives the readers a new leaf state, so the cost of the order
# between stale read-only transactions shows in the checks of the other leaves. The `stale` readers use
# a new view for each transaction, and the `stale-view` readers one view for
# all transactions of the worker.

[pools.stale]
keys = 256
value-bytes = 256

# Small leaves, so that the readers use many leaves. A seed leaf splits at
# once only above twice its cap, so the seed cap is half of the cell cap: the
# cell then starts with no leaf above its cap, and its topology does not change
# during the window.
[seed.database]
leaf-max-entries = 8

[cell.database]
leaf-max-entries = 16

[shapes.stale-writer]
kind = "read-modify-write"
pool = "stale"
source = "pool"
keys = 1

[shapes.stale-single]
kind = "read"
pool = "stale"
source = "pool"
keys = 1
staleness = "5s"

[shapes.stale-multi]
kind = "read"
pool = "stale"
source = "pool"
keys = 10
staleness = "5s"

[shapes.stale-view-single]
kind = "read"
pool = "stale"
source = "pool"
keys = 1
staleness = "250ms"
view = "worker"

[shapes.stale-view-multi]
kind = "read"
pool = "stale"
source = "pool"
keys = 10
staleness = "250ms"
view = "worker"

[workloads.stale-shared-leaves.groups.all]
instances = 1
shapes = { stale-writer = 1, stale-multi = 1 }

# `stale-single` alone beside the writer. Each of its transactions uses cached
# leaf states only, so it commits one transaction for each 5 µs of model time,
# and in virtual time it takes about as much wall time as model time. Its cases
# have a short window, so that the other shapes keep the long one. The writer
# has too few transactions in a short window for its metrics, so it only gives
# the load.
[workloads.stale-single-shared-leaves.groups.all]
instances = 1
shapes = { stale-single = 1 }
loads = { stale-writer = 1 }

# The `stale-view` readers beside the writer. Most of their calls use cached
# leaf states only, so `stale-view-single` commits about 40,000 transactions in
# each second of model time, and their cases have a short window, as
# `stale-single`. Their bound of 250 ms is shorter than the window, so that
# their floors move several times in it.
[workloads.stale-view-shared-leaves.groups.all]
instances = 1
shapes = { stale-view-single = 1, stale-view-multi = 1 }
loads = { stale-writer = 1 }

[cell]
workload = "stale-shared-leaves"

# The `stale-view-shared-leaves` workload with the writer on a second
# instance. A write of another instance does not advance the watermarks of
# this instance, so after each move of a floor the readers check each leaf
# that they read. The experiments that use it set `cell.collections = 1`, so
# that both instances use the same collection. Only `stale-reads-view-foreign`
# uses it.
[workloads.stale-view-foreign-shared-leaves.groups.readers]
instances = 1
shapes = { stale-view-single = 1, stale-view-multi = 1 }

[workloads.stale-view-foreign-shared-leaves.groups.writers]
instances = 1
shapes = {}
loads = { stale-writer = 1 }

# Two cells of `mixed`, for the CI comparison: the low-conflict workload at an
# affinity of 50, and the high-conflict workload at an affinity of 100. Below
# an affinity of 100, the `rw-many` shape of the high-conflict workload does not
# converge, so the comparison would have no latency of it.
tags = ["ci/timing", "ci/extended", "area/mixed"]
include = ["../configs/common-workloads.toml"]

[[axes]]
name = "cell"
values = [
  { label = "low-conflict-50", set = { "cell.workload" = "low-conflict", "cell.affinity" = 50 } },
  { label = "high-conflict-100", set = { "cell.workload" = "high-conflict", "cell.affinity" = 100 } },
]

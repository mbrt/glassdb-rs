# The affinity grid: 5 affinities at 1, 3, 5, and 7 database instances.
tags = ["area/mixed"]
include = ["../configs/common-workloads.toml"]

[cell]
workload = "low-conflict"
workers = 20

[[axes]]
path = "cell.affinity"
values = [0, 25, 50, 75, 100]

[[axes]]
path = "cell.databases"
values = [1, 3, 5, 7]

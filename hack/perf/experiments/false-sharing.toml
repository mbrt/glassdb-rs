# False sharing: four database instances each write one of the adjacent keys 0
# to 3, which share a leaf, while one more instance reads and writes the keys
# around them (ADR-084).
#
# The default topology policy must split the keys of the four instances apart
# (ADR-085), and then keep them apart, while the keys of the background
# instance stay in moderate leaves.
tags = ["ci/timing", "area/topology"]

[pools.false-sharing]
keys = 4096

[shapes.hot0]
kind = "write"
pool = "false-sharing"
source = { index = { keys = [0] } }

[shapes.hot1]
kind = "write"
pool = "false-sharing"
source = { index = { keys = [1] } }

[shapes.hot2]
kind = "write"
pool = "false-sharing"
source = { index = { keys = [2] } }

[shapes.hot3]
kind = "write"
pool = "false-sharing"
source = { index = { keys = [3] } }

[shapes.bg-rmw-seq]
kind = "read-modify-write"
pool = "false-sharing"
source = { sequence = { start = 4, count = 60, order = "ascending" } }
keys = 1

[shapes.bg-read-seq]
kind = "read"
pool = "false-sharing"
source = { sequence = { start = 4, count = 60, order = "ascending" } }
keys = 1

[shapes.bg-rmw-pool]
kind = "read-modify-write"
pool = "false-sharing"
source = "pool"
keys = 1

[shapes.bg-read-pool]
kind = "read"
pool = "false-sharing"
source = "pool"
keys = 1

[workloads.false-sharing.groups.hot0]
instances = 1
shapes = { hot0 = 4 }

[workloads.false-sharing.groups.hot1]
instances = 1
shapes = { hot1 = 4 }

[workloads.false-sharing.groups.hot2]
instances = 1
shapes = { hot2 = 4 }

[workloads.false-sharing.groups.hot3]
instances = 1
shapes = { hot3 = 4 }

[workloads.false-sharing.groups.background]
instances = 1
shapes = { bg-rmw-seq = 8, bg-read-seq = 8, bg-rmw-pool = 8, bg-read-pool = 8 }

[seed]
quiet-period = "10s"
timeout = "600s"

[cell]
workload = "false-sharing"
collections = 1
gc = false

[cell.warm-up]
minimum = "30s"
quiet = "10s"
timeout = "120s"

[cell.measure]
until = "duration"
duration = "60s"
max-duration = "120s"

# False sharing: four database instances each write one of the adjacent keys 0
# to 3, which share a leaf, while one more instance reads and writes the keys
# around them (ADR-084). Run with
# --config=hack/perf/experiments/false-sharing.toml --experiment=false-sharing.
# The axis `policy` selects the topology: the engine defaults, the avoidable
# time policy, or one key in each leaf.

[pools.false-sharing]
keys = 4096

[shapes.hot0]
kind = "write"
pool = "false-sharing"
source = { index = { keys = [0] } }

[shapes.hot1]
kind = "write"
pool = "false-sharing"
source = { index = { keys = [1] } }

[shapes.hot2]
kind = "write"
pool = "false-sharing"
source = { index = { keys = [2] } }

[shapes.hot3]
kind = "write"
pool = "false-sharing"
source = { index = { keys = [3] } }

[shapes.bg-rmw-seq]
kind = "read-modify-write"
pool = "false-sharing"
source = { sequence = { start = 4, count = 60, order = "ascending" } }
keys = 1

[shapes.bg-read-seq]
kind = "read"
pool = "false-sharing"
source = { sequence = { start = 4, count = 60, order = "ascending" } }
keys = 1

[shapes.bg-rmw-pool]
kind = "read-modify-write"
pool = "false-sharing"
source = "pool"
keys = 1

[shapes.bg-read-pool]
kind = "read"
pool = "false-sharing"
source = "pool"
keys = 1

[workloads.false-sharing.groups.hot0]
instances = 1
shapes = { hot0 = 4 }

[workloads.false-sharing.groups.hot1]
instances = 1
shapes = { hot1 = 4 }

[workloads.false-sharing.groups.hot2]
instances = 1
shapes = { hot2 = 4 }

[workloads.false-sharing.groups.hot3]
instances = 1
shapes = { hot3 = 4 }

[workloads.false-sharing.groups.background]
instances = 1
shapes = { bg-rmw-seq = 8, bg-read-seq = 8, bg-rmw-pool = 8, bg-read-pool = 8 }

[experiments.false-sharing.set]
cell.workload = "false-sharing"
cell.collections = 1
seed.quiet-period = "10s"
cell.gc = false
cell.warm-up.minimum = "30s"
cell.warm-up.quiet = "10s"
cell.warm-up.timeout = "120s"
cell.measure.until = "duration"
cell.measure.duration = "60s"
cell.measure.max-duration = "120s"

[[experiments.false-sharing.axes]]
name = "policy"

[[experiments.false-sharing.axes.values]]
label = "default"
[experiments.false-sharing.axes.values.set]
"seed.timeout" = "600s"

[[experiments.false-sharing.axes.values]]
label = "avoidable"
[experiments.false-sharing.axes.values.set]
"seed.timeout" = "600s"
"seed.database.topology" = "avoidable"
"cell.database.topology" = "avoidable"

# The seed has one key in each leaf, which takes longer to settle.
[[experiments.false-sharing.axes.values]]
label = "fixed-1"
[experiments.false-sharing.axes.values.set]
"seed.timeout" = "1800s"
"seed.database.topology" = "size"
"seed.database.leaf-max-entries" = 1
"seed.database.leaf-min-entries" = 0
"seed.database.index-min-children" = 0
"cell.database.topology" = "size"
"cell.database.leaf-min-entries" = 0
"cell.database.index-min-children" = 0

# The affinity grid of the canonical plots.
include = ["../../configs/common-workloads.toml"]

[cell]
workload = "low-conflict"
workers = 20

# With the avoidable time policy, the rule needs some half-lives of its
# averages (10 s) before it splits, so a shorter warm-up can end quiet on the
# topology that it starts with.
[cell.warm-up]
minimum = "30s"

[[axes]]
path = "cell.affinity"
values = [0, 25, 50, 75, 100]

[[axes]]
path = "cell.databases"
values = [1, 3, 5, 7]

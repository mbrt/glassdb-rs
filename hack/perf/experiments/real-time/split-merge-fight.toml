# A stable load under which both a split and a merge of one leaf make sense.
# Two writers of one key each lose leaf CASes to each other, so a split of the
# leaf between the two keys removes these losses. A scanner reads both keys, so
# a merge of the two leaves removes a leaf read from each scan.
#
# The default topology policy must settle: after the warm-up, the collection
# stays at one leaf or at two leaves, and the measurement shows no splits and
# no merges. The axis `start` gives the shape that the cells start from.

[pools.fight]
keys = 2

[shapes.write-left]
kind = "write"
pool = "fight"
source = { index = { keys = [0] } }

[shapes.write-right]
kind = "write"
pool = "fight"
source = { index = { keys = [1] } }

[shapes.scan-all]
kind = "scan"
pool = "fight"
source = { index = { keys = [0] } }

[workloads.fight.groups.left-splitter]
instances = 1
shapes = { write-left = 4 }

[workloads.fight.groups.right-splitter]
instances = 1
shapes = { write-right = 4 }

[workloads.fight.groups.merger]
instances = 1
shapes = { scan-all = 8 }

[seed]
quiet-period = "1s"

[cell]
workload = "fight"
collections = 1
gc = false

[cell.warm-up]
quiet = "never"
timeout = "10s"

[cell.measure]
until = "duration"
duration = "60s"
max-duration = "120s"

[[axes]]
name = "start"

# The seed keeps the two keys in one leaf.
[[axes.values]]
label = "one-leaf"

# The seed splits the leaf between the two keys. The seed uses the size causes,
# so that this start does not depend on changes to the default policy.
[[axes.values]]
label = "two-leaves"
[axes.values.set]
"seed.database.topology" = "size-causes"
"seed.database.leaf-max-entries" = 1
"seed.database.leaf-min-entries" = 0
"seed.database.index-min-children" = 0

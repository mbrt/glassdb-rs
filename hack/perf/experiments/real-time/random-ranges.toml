# Transactions on ranges of 16 and 64 adjacent keys from random starts, on
# fixed sets of 3 keys, and on single keys, for the write spans of ADR-084.
# See the investigation of 2026-10-28 in investigations.md.

[pools.wide]
keys = 20000

[shapes.rw-range16]
kind = "read-modify-write"
pool = "wide"
source = "adjacent"
keys = 16

[shapes.rw-range64]
kind = "read-modify-write"
pool = "wide"
source = "adjacent"
keys = 64

[shapes.rw-single]
kind = "read-modify-write"
pool = "wide"
keys = 1

[shapes.ro-single]
kind = "read"
pool = "wide"
keys = 1

# Non-contiguous sets: 3 keys at offsets {0, 1, 8} from base keys spaced 400 apart
[shapes.rw-set-0]
kind = "read-modify-write"
pool = "wide"
keys = 3
source = { index = { keys = [0, 1, 8] } }

[shapes.rw-set-1]
kind = "read-modify-write"
pool = "wide"
keys = 3
source = { index = { keys = [400, 401, 408] } }

[shapes.rw-set-2]
kind = "read-modify-write"
pool = "wide"
keys = 3
source = { index = { keys = [800, 801, 808] } }

[shapes.rw-set-3]
kind = "read-modify-write"
pool = "wide"
keys = 3
source = { index = { keys = [1200, 1201, 1208] } }

[shapes.rw-set-4]
kind = "read-modify-write"
pool = "wide"
keys = 3
source = { index = { keys = [1600, 1601, 1608] } }

[shapes.rw-set-5]
kind = "read-modify-write"
pool = "wide"
keys = 3
source = { index = { keys = [2000, 2001, 2008] } }

[shapes.rw-set-6]
kind = "read-modify-write"
pool = "wide"
keys = 3
source = { index = { keys = [2400, 2401, 2408] } }

[shapes.rw-set-7]
kind = "read-modify-write"
pool = "wide"
keys = 3
source = { index = { keys = [2800, 2801, 2808] } }

[workloads.random-ranges.groups.all]
shapes = { rw-range16 = 8, rw-range64 = 8, rw-single = 8, ro-single = 8, rw-set-0 = 1, rw-set-1 = 1, rw-set-2 = 1, rw-set-3 = 1, rw-set-4 = 1, rw-set-5 = 1, rw-set-6 = 1, rw-set-7 = 1 }

[cell]
workload = "random-ranges"
collections = 1
gc = false

[cell.warm-up]
minimum = "30s"
quiet = "10s"
timeout = "180s"

[cell.measure]
until = "converged"
duration = "60s"
max-duration = "180s"

[[axes]]
path = "cell.databases"
values = [1, 5]

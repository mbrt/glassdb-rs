# Stale read-only transactions (ADR-097) on the mixed low-conflict workload:
# the `ro` shapes run `Database::read_tx` beside the `rw` shapes on the same
# instances. To compare with `Database::tx`, run `workers`.
tags = ["extra", "area/read"]
include = ["../configs/workers.toml"]

[shapes.ro-single]
staleness = "5s"

[shapes.ro-multi]
staleness = "5s"

[[axes]]
path = "cell.workers"
values = [1, 50, 100, 200]

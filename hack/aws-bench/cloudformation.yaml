AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Private GlassDB S3 performance runner. Creates a VPC, S3 and SSM endpoints,
  an encrypted result bucket, and an EC2 instance that downloads a perfbench
  binary plus its runner configuration, executes it, uploads results, and
  optionally stops itself.

Parameters:
  InstanceType:
    Type: String
    Default: c7i.8xlarge
    Description: EC2 instance type; must match the uploaded binary architecture.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the dedicated private VPC.
  SubnetCidr:
    Type: String
    Default: 10.0.0.0/24
  BinaryS3Key:
    Type: String
    Default: bin/perfbench
    Description: Key used by deploy.sh for the static perfbench binary.
  RunnerS3Key:
    Type: String
    Default: bin/run-perfbench
    Description: Key used by deploy.sh for the workload runner.
  ConfigS3Key:
    Type: String
    Default: bin/perfbench.env
    Description: Key used by deploy.sh for the shell-escaped workload options.
  AutoStop:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Stop the instance automatically when the benchmark finishes.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Resolved at deploy time to the latest Amazon Linux 2023 AMI.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private"

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref Subnet

  # There is no IGW or NAT route. The open default egress can therefore reach
  # only VPC resources and the explicitly configured service endpoints.
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GlassDB performance runner
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance-sg"

  # The runner needs HTTPS ingress to the interface endpoints, not to itself.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GlassDB runner interface endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-endpoint-sg"

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref RouteTable]

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref Subnet]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref Subnet]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref Subnet]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  Ec2Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref Subnet]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  BenchBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: benchmark-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${BenchBucket.Arn}/*"
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt BenchBucket.Arn
        - PolicyName: self-stop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  BenchInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - S3GatewayEndpoint
      - SsmEndpoint
      - SsmMessagesEndpoint
      - Ec2MessagesEndpoint
      - Ec2Endpoint
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-runner"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -uo pipefail
          exec > /var/log/perfbench-bootstrap.log 2>&1

          export AWS_REGION="${AWS::Region}"
          export AWS_DEFAULT_REGION="${AWS::Region}"
          export BUCKET="${BenchBucket}"
          cd /root

          fetch() {
            key="$1"
            target="$2"
            attempt=0
            while [ "$attempt" -lt 120 ]; do
              if aws s3 cp "s3://$BUCKET/$key" "$target"; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 15
            done
            return 1
          }

          fetch "${BinaryS3Key}" ./perfbench || exit 1
          fetch "${RunnerS3Key}" ./run-perfbench || exit 1
          fetch "${ConfigS3Key}" ./perfbench.env || exit 1
          chmod +x ./perfbench ./run-perfbench

          mkdir -p out
          ./run-perfbench
          BENCH_STATUS=$?

          TS=$(date +%Y%m%dT%H%M%S)
          RESULT_PREFIX="results/$TS"
          aws s3 cp out/ "s3://$BUCKET/$RESULT_PREFIX/" --recursive
          aws s3 cp /var/log/perfbench-bootstrap.log \
            "s3://$BUCKET/$RESULT_PREFIX/bootstrap.log" || true

          if [ "${AutoStop}" = "true" ]; then
            TOKEN=$(curl -sS -X PUT \
              "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            IID=$(curl -sS \
              -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)
            aws ec2 stop-instances --instance-ids "$IID"
          fi
          exit "$BENCH_STATUS"

Outputs:
  BucketName:
    Description: Bucket holding benchmark objects, runner artifacts, and results.
    Value: !Ref BenchBucket
  InstanceId:
    Description: Benchmark runner instance ID for SSM sessions.
    Value: !Ref BenchInstance
  BinaryUploadTarget:
    Description: Upload target for the static perfbench binary.
    Value: !Sub "s3://${BenchBucket}/${BinaryS3Key}"
  RunnerUploadTarget:
    Description: Upload target for the workload runner.
    Value: !Sub "s3://${BenchBucket}/${RunnerS3Key}"
  ConfigUploadTarget:
    Description: Upload target for the workload configuration.
    Value: !Sub "s3://${BenchBucket}/${ConfigS3Key}"
  ResultsPrefix:
    Description: Timestamped result directories are written below this prefix.
    Value: !Sub "s3://${BenchBucket}/results/"
  SsmSessionCommand:
    Description: Open an interactive shell on the private runner.
    Value: !Sub "aws ssm start-session --target ${BenchInstance} --region ${AWS::Region}"

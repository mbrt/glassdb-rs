name: Fuzz

on:
  schedule:
    - cron: '33 2 * * *'   # daily
  workflow_dispatch:        # allow manual runs
    inputs:
      force:
        description: 'Fuzz even if no Rust files changed since the last run'
        type: boolean
        default: false
      duration:
        description: 'Total fuzzing duration in minutes'
        type: number
        default: 30

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0      # need full history to compare Rust vs corpus commits
        persist-credentials: false

    - name: Decide whether fuzzing is needed
      id: changes
      run: |
        if [ "${{ inputs.force }}" = "true" ]; then
          echo "Manual run with force=true; fuzzing regardless of changes."
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The fuzz job commits the minimized corpus after every run, so the last
        # corpus commit marks the last time fuzzing ran. Compare it against the
        # last commit that touched any Rust file: skip only when the corpus was
        # updated strictly after the latest Rust change (fuzzing already covered
        # it). This depends solely on commit history, so it is immune to missing
        # or expired previous workflow runs.
        rust_commit=$(git log -1 --format=%H -- '*.rs')
        corpus_commit=$(git log -1 --format=%H -- fuzz/corpus)
        if [ -z "$rust_commit" ]; then
          echo "No Rust files in history; fuzzing."
          echo "run=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$corpus_commit" ] && [ "$corpus_commit" != "$rust_commit" ] \
            && git merge-base --is-ancestor "$rust_commit" "$corpus_commit"; then
          echo "Corpus update ($corpus_commit) is newer than the last Rust change ($rust_commit); skipping."
          echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "Rust changed since the last corpus update; fuzzing."
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi

  # The fuzz and pct jobs run in parallel. They are separate jobs, so a failure
  # in one job does not cancel the other.
  fuzz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    environment: fuzz-corpus-writer
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0      # the corpus push rebases onto a newer main
        persist-credentials: false

    - name: Install nightly Rust toolchain
      uses: dtolnay/rust-toolchain@nightly

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          fuzz -> target

    # Build cargo-fuzz from source rather than using a prebuilt binary: the
    # published musl binaries default their fuzz target to the triple they were
    # compiled for (musl), which links libc statically and is incompatible with
    # the sanitizer (rust-fuzz/cargo-fuzz#398). A source build targets the gnu
    # host, so `cargo fuzz` picks the correct default target.
    - name: Install cargo-fuzz
      run: cargo install --locked cargo-fuzz

    - name: Fuzz, then minimize
      env:
        DURATION_MINUTES: ${{ inputs.duration || 30 }}
      run: |
        total=$((DURATION_MINUTES * 60))
        n=$(cd fuzz && cargo +nightly fuzz list | wc -l)
        per=$((total / n))
        echo "Fuzzing $n target(s) for ${per}s each (~${DURATION_MINUTES} min total)"
        if ! make fuzz FUZZ_TIME="$per"; then
          echo "::error::fuzzing failed (build error or crash); if a crash, see the uploaded fuzz-crashes artifact"
          echo "To reproduce a downloaded crash file:"
          echo "  cd fuzz && RUSTFLAGS=\"--cfg sim --cfg tokio_unstable\" cargo +nightly fuzz run -s none <target> <crash-file>"
          echo "Or replay on stable: drop the file into fuzz/corpus/<target>/ and run 'make test-sim'."
          exit 1
        fi
        make fuzz-min

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes-${{ github.run_id }}
        path: fuzz/artifacts/
        if-no-files-found: ignore
        retention-days: 30

    - name: Create corpus push token
      id: push-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.FUZZ_APP_CLIENT_ID }}
        private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
        permission-contents: write

    - name: Commit and push corpus updates
      env:
        GH_TOKEN: ${{ steps.push-token.outputs.token }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add fuzz/corpus
        if git diff --cached --quiet; then
          echo "No corpus changes to commit."
          exit 0
        fi
        git commit -m "ci(fuzz): update minimized corpus"
        gh auth setup-git
        # Other commits can land on main while fuzzing runs.
        git fetch origin main
        git rebase --autostash origin/main
        git push origin HEAD:main

  # PCT finds a race only on the seeds that it runs, and `make test` runs a
  # small number of seeds per sweep. This job runs many more seeds in each
  # sweep, sized to take about as long as the fuzz job. A failure prints its
  # seed, and `pct_assert` with that seed reproduces it. The job skips the
  # corpus replay tests (`replays_committed_*`), because the seed count does
  # not change them and `make test` already runs them.
  pct:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Deep PCT seed sweep
      timeout-minutes: 90
      env:
        GLASSDB_PCT_SEEDS: 49152
      run: |
        echo "Sweeping commit $(git rev-parse HEAD)"
        make test-sim SIM_TEST_ARGS="--skip replays_committed_"

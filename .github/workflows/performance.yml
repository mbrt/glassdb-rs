name: Performance comparison

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    name: Compare to main
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      PERF_RESULTS: ${{ github.workspace }}/target/performance/results/ci
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target/performance/main
          . -> target/performance/pr

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Test benchmarks and tools
      run: make test-bench

    - name: Build harness
      id: build
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Compare the PR head to its fork point, not to the moving tip of main or
      # to the synthetic merge commit that is checked out, so that unrelated
      # changes on main do not count as changes of the PR.
      run: |
        MERGE_BASE=$(git merge-base "$HEAD_SHA" "$BASE_SHA")
        python3 hack/ci/perf_compare.py --base "$MERGE_BASE" \
          --candidate "$HEAD_SHA" --output "$PERF_RESULTS" --build-only

    - name: Measure workloads
      id: measure
      timeout-minutes: 90
      # Each revision runs `make bench` with the binary and the experiments
      # that the build step records in its manifest: the counter experiments
      # once, and the timing experiments 32 times, on virtual time, with the
      # runs in parallel. By an estimate from a laptop, the timing process
      # takes about 30 minutes on 4 vCPUs. Each benchmark process has its own
      # timeout of 40 minutes, so that a hang shows as a timeout of its
      # process, not of this step.
      run: |
        manifest="$PERF_RESULTS/manifest.json"
        # The log of each side goes to a file, which the artifact keeps, so
        # that it does not fill the log of the job. A failed side shows the
        # end of its log here.
        for side in main pr; do
          log="$PERF_RESULTS/$side.log"
          make bench PERFBENCH="$(jq -r ".$side.perfbench" "$manifest")" \
            EXPERIMENTS_DIR="$(jq -r .experiments "$manifest")" \
            OUT="$PERF_RESULTS/$side" > "$log" 2>&1 || { tail -n 50 "$log"; exit 1; }
        done

    - name: Compare
      if: ${{ always() && steps.build.outcome == 'success' }}
      env:
        MEASURE_OUTCOME: ${{ steps.measure.outcome }}
      run: |
        warnings=()
        if [ "$MEASURE_OUTCOME" != success ]; then
          warnings+=("--warning=The measurement step failed ($MEASURE_OUTCOME); see the <side>.log files in the performance-results artifact.")
        fi
        python3 hack/ci/perf_report.py --manifest "$PERF_RESULTS/manifest.json" \
          --base "$PERF_RESULTS/main" --candidate "$PERF_RESULTS/pr" \
          "${warnings[@]}" --output "$PERF_RESULTS/report.md"

    - name: Render job summary
      if: ${{ always() }}
      run: |
        if [ -f "$PERF_RESULTS/report.md" ]; then
          cat "$PERF_RESULTS/report.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo 'Performance comparison failed before measurements. See build logs.' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Hide old comments
      if: >-
        success() && github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        github-token: ${{ github.token }}
        script: |
          const response = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          })
          const commentIds = response.data
            .filter(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('# Performance comparison')
            )
            .map(comment => comment.node_id)
          for (const id of commentIds) {
            await github.graphql(`
              mutation {
                minimizeComment(input: {classifier: OUTDATED, subjectId: "${id}"}) {
                  minimizedComment { isMinimized }
                }
              }
            `)
          }

    - name: Comment
      if: >-
        success() && github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: >-
        gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
        --body-file "$PERF_RESULTS/report.md"

    - name: Upload results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          ${{ env.PERF_RESULTS }}
          !${{ env.PERF_RESULTS }}/bin/**
        if-no-files-found: warn
        retention-days: 7

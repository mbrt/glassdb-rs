name: Performance comparison

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    name: Compare to main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PERF_RESULTS: ${{ github.workspace }}/target/performance/results/ci
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target/performance/main
          . -> target/performance/pr

    - name: Test comparison tools
      run: python3 -m unittest hack.ci.test_perf_report hack.ci.test_perf_compare

    - name: Build the same candidate harness against both revisions
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: >-
        python3 hack/ci/perf_compare.py --base "$BASE_SHA"
        --output "$PERF_RESULTS" --build-only

    - name: Measure paired diagnostics and mixed workload
      timeout-minutes: 5
      # The driver enforces a 270-second runtime budget, excluding compilation.
      run: python3 hack/ci/perf_compare.py --output "$PERF_RESULTS" --run-only

    - name: Render job summary
      if: ${{ always() }}
      run: |
        if [ -f "$PERF_RESULTS/report.md" ]; then
          cat "$PERF_RESULTS/report.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo 'Performance comparison failed before measurements. See build logs.' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Hide old performance comments
      if: >-
        success() && github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        github-token: ${{ github.token }}
        script: |
          const response = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          })
          const commentIds = response.data
            .filter(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('# Performance comparison')
            )
            .map(comment => comment.node_id)
          for (const id of commentIds) {
            await github.graphql(`
              mutation {
                minimizeComment(input: {classifier: OUTDATED, subjectId: "${id}"}) {
                  minimizedComment { isMinimized }
                }
              }
            `)
          }

    - name: Comment on pull request
      if: >-
        success() && github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: >-
        gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
        --body-file "$PERF_RESULTS/report.md"

    - name: Upload performance results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          ${{ env.PERF_RESULTS }}
          !${{ env.PERF_RESULTS }}/bin/**
        if-no-files-found: warn
        retention-days: 7

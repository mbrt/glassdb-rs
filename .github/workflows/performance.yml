name: Performance comparison

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    name: Compare to main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/performance
      PERF_DELAY_SCALE: "0.2"
    steps:

    - name: Initialize result artifact
      env:
        PERF_BIN: ${{ runner.temp }}/glassdb-performance-bin
        PERF_RESULTS: ${{ runner.temp }}/glassdb-performance-results
      run: |
        install -d "$PERF_BIN" \
          "$PERF_RESULTS/score/main" "$PERF_RESULTS/score/pr" \
          "$PERF_RESULTS/mixed/main" "$PERF_RESULTS/mixed/pr" \
          "$PERF_RESULTS/contention/main" "$PERF_RESULTS/contention/pr"

    - uses: actions/checkout@v4

    - name: Check out main baseline
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: .perf-main

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - uses: astral-sh/setup-uv@v6

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target/performance

    - name: Test performance report generator
      run: |
        python3 -m unittest hack.ci.test_perf_report
        uv run hack/aws-bench/test_compare.py

    - name: Build baseline and candidate benchmarks
      env:
        PERF_BIN: ${{ runner.temp }}/glassdb-performance-bin
      run: |
        # Build baseline and candidate into separate target dirs. They are
        # distinct source trees, so sharing one target dir lets cargo reuse a
        # stale artifact from the other tree (e.g. glassdb-proto), producing
        # spurious compile errors against outdated generated types.
        cargo build --release --manifest-path .perf-main/Cargo.toml \
          --target-dir "$CARGO_TARGET_DIR/main" \
          --package glassdb-bench-score --bin autoresearch
        install -m 755 "$CARGO_TARGET_DIR/main/release/autoresearch" \
          "$PERF_BIN/main-autoresearch"
        if [[ -f .perf-main/crates/glassdb-bench-scale/src/bin/perfbench/main.rs ]]; then
          cargo build --release --manifest-path .perf-main/Cargo.toml \
            --target-dir "$CARGO_TARGET_DIR/main" \
            --package glassdb-bench-scale --bin perfbench
          install -m 755 "$CARGO_TARGET_DIR/main/release/perfbench" \
            "$PERF_BIN/main-perfbench"
        else
          cargo build --release --manifest-path .perf-main/Cargo.toml \
            --target-dir "$CARGO_TARGET_DIR/main" \
            --package glassdb-bench-scale --bin mixbench --bin rtbench
          install -m 755 "$CARGO_TARGET_DIR/main/release/mixbench" \
            "$PERF_BIN/main-mixbench"
          install -m 755 "$CARGO_TARGET_DIR/main/release/rtbench" \
            "$PERF_BIN/main-rtbench"
        fi

        cargo build --release \
          --target-dir "$CARGO_TARGET_DIR/pr" \
          --package glassdb-bench-score --bin autoresearch \
          --package glassdb-bench-scale --bin perfbench
        install -m 755 "$CARGO_TARGET_DIR/pr/release/autoresearch" \
          "$PERF_BIN/pr-autoresearch"
        install -m 755 "$CARGO_TARGET_DIR/pr/release/perfbench" \
          "$PERF_BIN/pr-perfbench"

    - name: Measure backend-operation score
      timeout-minutes: 3
      env:
        PERF_BIN: ${{ runner.temp }}/glassdb-performance-bin
        PERF_RESULTS: ${{ runner.temp }}/glassdb-performance-results
      run: |
        run_score() {
          local side="$1" binary="$2" repetition="$3"
          "$binary" --json --count 1 \
            > "$PERF_RESULTS/score/$side/$repetition.json"
        }

        for repetition in $(seq 1 11); do
          printf -v repetition_id '%02d' "$repetition"
          if (( repetition % 2 == 1 )); then
            run_score main "$PERF_BIN/main-autoresearch" "$repetition_id"
            run_score pr "$PERF_BIN/pr-autoresearch" "$repetition_id"
          else
            run_score pr "$PERF_BIN/pr-autoresearch" "$repetition_id"
            run_score main "$PERF_BIN/main-autoresearch" "$repetition_id"
          fi
        done

    - name: Measure focused high-contention mix
      timeout-minutes: 8
      env:
        PERF_BIN: ${{ runner.temp }}/glassdb-performance-bin
        PERF_RESULTS: ${{ runner.temp }}/glassdb-performance-results
      run: |
        run_mix() {
          local side="$1" repetition="$2"
          local result="$PERF_RESULTS/mixed/$side/$repetition.json"
          if [[ -x "$PERF_BIN/$side-perfbench" ]]; then
            "$PERF_BIN/$side-perfbench" \
              --backend=memory --delays=s3 --delay-scale="$PERF_DELAY_SCALE" \
              --drain-timeout=30s --output="$result" mixed \
              --duration=1s --max-duration=20s --target-ci=0.15 \
              --modes=hi --affinities=100 --databases=1 \
              --workers-per-shape=8 --hot-keys=8 --multi-keys=8 \
              --split-quiet=2s --split-settle-timeout=30s
            return
          fi
          local binary="$PERF_BIN/$side-mixbench"
          local layout=()
          if "$binary" --help 2>&1 | grep -q -- "--affinities"; then
            layout=(
              --affinities=100
              --databases=1
              --split-quiet=2s
              --split-settle-timeout=30s
            )
          else
            # Transitional equivalence for a baseline before the affinity
            # schema: one Database and one collection is the old shared cell.
            layout=(--topologies=shared)
          fi
          "$binary" \
            --delays=s3 --delay-scale="$PERF_DELAY_SCALE" --drain-timeout=30s \
            --duration=1s --max-duration=20s --target-ci=0.15 \
            --modes=hi --workers-per-shape=8 --hot-keys=8 --multi-keys=8 \
            --json "${layout[@]}" > "$result"
        }

        for repetition in 1 2 3; do
          printf -v repetition_id '%02d' "$repetition"
          if (( repetition % 2 == 1 )); then
            run_mix main "$repetition_id"
            run_mix pr "$repetition_id"
          else
            run_mix pr "$repetition_id"
            run_mix main "$repetition_id"
          fi
        done

    - name: Measure focused one-key RMW contention
      timeout-minutes: 5
      env:
        PERF_BIN: ${{ runner.temp }}/glassdb-performance-bin
        PERF_RESULTS: ${{ runner.temp }}/glassdb-performance-results
      run: |
        run_contention() {
          local side="$1" repetition="$2"
          if [[ -x "$PERF_BIN/$side-perfbench" ]]; then
            "$PERF_BIN/$side-perfbench" \
              --backend=memory --delays=s3 --delay-scale="$PERF_DELAY_SCALE" \
              --drain-timeout=30s \
              --output="$PERF_RESULTS/contention/$side/$repetition.json" \
              contention --keys=1 --duration=1s
            return
          fi
          local binary="$PERF_BIN/$side-rtbench"
          local samples="$PERF_RESULTS/contention/$side/$repetition.csv"
          local stats="$PERF_RESULTS/contention/$side/$repetition-stats.csv"
          local optional=()

          if "$binary" --help 2>&1 | grep -q -- "--deadlock-keys"; then
            optional+=(--deadlock-keys=1)
          fi
          if "$binary" --help 2>&1 | grep -q -- "--deadlock-stats-out"; then
            optional+=(--deadlock-stats-out="$stats")
          fi

          "$binary" \
            --backend=memory \
            --delays=s3 \
            --delay-scale="$PERF_DELAY_SCALE" \
            --test-name=deadlock \
            --duration=1s \
            --drain-timeout=30s \
            --num-runs=1 \
            --deadlock-out="$samples" \
            "${optional[@]}"
        }

        for repetition in 1 2 3; do
          printf -v repetition_id '%02d' "$repetition"
          if (( repetition % 2 == 1 )); then
            run_contention main "$repetition_id"
            run_contention pr "$repetition_id"
          else
            run_contention pr "$repetition_id"
            run_contention main "$repetition_id"
          fi
        done

    - name: Render job summary
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.sha }}
        PERF_RESULTS: ${{ runner.temp }}/glassdb-performance-results
      run: |
        python3 hack/ci/perf_report.py \
          --input "$PERF_RESULTS" \
          --base-label "main (${BASE_SHA:0:12})" \
          --candidate-label "PR merge (${CANDIDATE_SHA:0:12})" \
          --output "$PERF_RESULTS/report.md"
        cat "$PERF_RESULTS/report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Hide old performance comments
      if: >-
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        github-token: ${{ github.token }}
        script: |
          const response = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          })
          const commentIds = response.data
            .filter(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('# Performance comparison')
            )
            .map(comment => comment.node_id)

          for (const id of commentIds) {
            await github.graphql(`
              mutation {
                minimizeComment(input: {classifier: OUTDATED, subjectId: "${id}"}) {
                  minimizedComment {
                    isMinimized
                  }
                }
              }
            `)
          }

    - name: Comment on pull request
      if: >-
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        PERF_RESULTS: ${{ runner.temp }}/glassdb-performance-results
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: >-
        gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
        --body-file "$PERF_RESULTS/report.md"

    - name: Upload performance results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: ${{ runner.temp }}/glassdb-performance-results
        if-no-files-found: error
        retention-days: 7

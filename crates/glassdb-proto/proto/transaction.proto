syntax = "proto3";

package glassdb;

import "google/protobuf/timestamp.proto";

message TransactionRecord {
    enum Status {
        DEFAULT = 0;
        COMMITTED = 1;
        ABORTED = 2;
        PENDING = 3;
        WOUNDED = 4;
    }

    google.protobuf.Timestamp timestamp = 1;
    Status status = 2;
    repeated CollectionWrites writes = 3;
    repeated CollectionChange collection_changes = 4;
    repeated bytes prepared_collection_ids = 5;
}

message CollectionWrites {
    // Stable collection ID. The database prefix comes from the enclosing
    // transaction record's physical path and is deliberately omitted.
    bytes collection_id = 1;
    repeated Write writes = 2;
    CollectionLocks locks = 3;
}

message Write {
    bytes key = 1;

    oneof val_delete {
        bytes value = 2;
        bool deleted = 4;
    }
}

message CollectionLocks {
    repeated KeyLock key_locks = 1;
    repeated MembershipLock membership_locks = 2;
    Lock.LockType directory_lock = 3;
    bool topology_participant = 4;
}

message CollectionChange {
    enum Operation {
        UNKNOWN = 0;
        CREATE = 1;
        DROP = 2;
    }

    bytes parent_collection_id = 1;
    bytes name = 2;
    bytes collection_id = 3;
    Operation operation = 4;
}

message KeyLock {
    bytes key = 1;
    Lock.LockType lock_type = 2;
}

message MembershipLock {
    oneof target {
        // The fixed tree root object (`_r`). Always encoded as true.
        bool root = 1;
        // The node ID of a standalone node object (`_n/<node-id>`).
        bytes node = 2;
    }
    Lock.LockType lock_type = 3;
}

message Lock {
    enum LockType {
        UNKNOWN = 0;
        NONE = 1;
        READ = 2;
        WRITE = 3;
        CREATE = 4;
    }
}

message NodeLock {
    Lock.LockType lock_type = 1;
    repeated bytes locked_by = 2;
}

// A leaf body: the point-access coordination entries for one terminal node.
// See ADR-017.
message LeafBody {
    repeated LeafEntry entries = 1;
}

message LeafEntry {
    // Raw user key bytes; also the entry's sort key.
    bytes key = 1;
    // Lock currently held on the key.
    Lock.LockType lock_type = 2;
    // Transactions holding the lock (more than one only for read locks).
    repeated bytes locked_by = 3;
    // The key's current committed value state, separate from the lock state.
    // Absent when the key has no committed value yet.
    CurrentState current = 4;
}

// A key's committed current value (ADR-051): its writer, which optimistic
// validation compares, plus a tag saying where the value itself lives. `state`
// is mandatory; a `CurrentState` without one is corrupt.
message CurrentState {
    // The transaction that produced this value. Always set. It does not always
    // name a transaction record: a direct commit inlines its value without ever
    // writing one.
    bytes writer = 1;

    oneof state {
        // The value lives in the writer's transaction record. Always true.
        bool external = 2;
        // The value is authoritative here. Distinguishable from an unset
        // `state` even when empty.
        bytes inline = 3;
        // The writer deleted the key. Always true; carries no payload.
        bool tombstone = 4;
    }
}

// A B-link tree node: the unit of the dynamic, range-partitioned coordination
// directory (ADR-031). It is either a leaf (the per-key coordination entries of
// ADR-017 for a contiguous key range) or an index (separator keys mapping
// ranges to child nodes). The high-key and right-sibling make tree descent
// self-correcting across concurrent splits.
message Node {
    // Exclusive upper bound of the key range this node covers. Empty means
    // +infinity: the rightmost node at its level.
    bytes high_key = 1;
    // Node ID of the right-sibling node at the same level. Empty means none:
    // the rightmost node at its level.
    bytes right_sibling = 2;
    oneof body {
        // A leaf node: the per-key coordination entries for its range.
        LeafBody leaf = 3;
        // An index node: separator keys mapping ranges to child nodes.
        IndexNode index = 4;
    }
    NodeLock structural_gate = 5;
    NodeLock membership_lock = 6;
    uint64 membership_generation = 7;
    // The transaction identity that drops the collection. Its final status
    // decides whether this drop intent is obsolete or makes the node stale.
    bytes drop_intent = 8;
    // Set after a merge moved this node's range and entries into its right
    // sibling (ADR-073). A drained node covers no key and never changes again.
    bool drained = 9;
    // The structural intent ID of a merge into this node that can still land
    // or be abandoned (ADR-073). Empty means none.
    bytes merge_reservation = 10;
    // Inclusive lower bound of the key range this node covers. Empty means the
    // first node at its level. A copy with a low key above a routed key is
    // older than a merge (ADR-073).
    bytes low_key = 11;
}

// A structural intent for one split or merge. It lives at
// `{db}/_s/<participant_id>/<intent_id>` until the structural change is
// complete or abandoned.
message StructuralIntent {
    enum Phase {
        PREPARING = 0;
        READY = 1;
    }

    // Stable collection ID. The database prefix comes from the intent's
    // physical path and is deliberately omitted.
    bytes collection_id = 1;
    // Node ID of the source. Empty when the source is the tree root.
    bytes source_node_id = 2;
    string source_revision = 3;
    repeated bytes created_node_ids = 4;
    bytes split_key = 5;
    bool is_root = 6;
    // The topology participant that owns this intent.
    bytes participant_id = 7;
    Phase phase = 8;
    // Present when the source merges into its right sibling (ADR-073). A merge
    // creates no node and has no split key.
    MergeIntent merge = 9;
}

message MergeIntent {
    // Node ID of the node that receives the source's entries. Empty until
    // Ready.
    bytes target_node_id = 1;
    // The source's high key at Ready: the low bound of the target before the
    // merge.
    bytes boundary = 2;
    // The membership generation of the target at Ready. The absorb lands only
    // while the target has this generation.
    uint64 target_generation = 3;
}

// An index node body: an ordered list of separator entries. Routing selects the
// last child whose separator_key is <= the key.
message IndexNode {
    repeated IndexEntry entries = 1;
}

message IndexEntry {
    // Inclusive lower bound of the child's key range; sorted so the encoding is
    // canonical.
    bytes separator_key = 1;
    // Node ID of the child node.
    bytes child = 2;
}

// Database-level metadata, written once at `{name}/glassdb` when a database is
// first opened. Its presence marks the database as initialized; `version` gates
// protocol and on-disk format compatibility.
message DatabaseMetadata {
    // Protocol and on-disk format version identifier.
    string version = 1;
    // Persistent random ID for this logical database. Exactly 16 bytes and
    // mandatory for the v2 format.
    bytes database_id = 2;
    // Hard coordination limits. Both fields are mandatory since v4.
    optional uint64 node_max_bytes = 3;
    optional uint64 split_headroom_bytes = 4;
    // Shared transaction timing. Both fields are mandatory since v4.
    optional uint64 pending_timeout_nanos = 5;
    optional uint64 max_clock_skew_nanos = 6;
}

// Collection metadata stored at `{prefix}/_i` (ADR-050). The B-link tree begins
// independently at `{prefix}/_r`; data-path operations do not read this record.
message CollectionRecord {
    // Direct child bindings, sorted by raw name so the encoding is canonical.
    repeated CollectionDirectoryEntry children = 1;
    // Transactional coordination for the bounded child directory.
    NodeLock directory_lock = 2;
    uint64 directory_generation = 3;
    // Collection topology is frozen while this transaction prepares a drop.
    bytes topology_freeze = 4;
    // Structural operations that joined before the freeze was installed.
    repeated bytes topology_participants = 5;
}

message CollectionDirectoryEntry {
    // Raw child name.
    bytes name = 1;
    // Stable 16-byte collection ID.
    bytes collection_id = 2;
}

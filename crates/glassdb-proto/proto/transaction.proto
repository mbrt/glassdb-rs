syntax = "proto3";

package glassdb;

import "google/protobuf/timestamp.proto";

message TransactionLog {
    enum Status {
        DEFAULT = 0;
        COMMITTED = 1;
        ABORTED = 2;
        PENDING = 3;
    }

    google.protobuf.Timestamp timestamp = 1;
    Status status = 2;
    repeated CollectionWrites writes = 3;
    repeated CollectionChange collection_changes = 4;
    repeated bytes prepared_collection_ids = 5;
}

message CollectionWrites {
    // Stable incarnation ID. The database root comes from the enclosing
    // transaction object's physical path and is deliberately omitted.
    bytes collection_id = 1;
    repeated Write writes = 2;
    CollectionLocks locks = 3;
}

message Write {
    bytes key = 1;
    // The ID of the last transaction writing to this key.
    bytes prev_tid = 3;

    oneof val_delete {
        bytes value = 2;
        bool deleted = 4;
    }
}

message CollectionLocks {
    repeated EntryLock entry_locks = 1;
    repeated MembershipLock membership_locks = 2;
    Lock.LockType directory_lock = 3;
    bool topology_lock = 4;
}

message CollectionChange {
    enum Operation {
        UNKNOWN = 0;
        CREATE = 1;
        DROP = 2;
    }

    bytes parent_collection_id = 1;
    bytes name = 2;
    bytes collection_id = 3;
    Operation operation = 4;
}

message EntryLock {
    bytes key = 1;
    Lock.LockType lock_type = 2;
}

message MembershipLock {
    oneof target {
        // The fixed tree root object (`_r`). Always encoded as true.
        bool root = 1;
        // The opaque token of a standalone node object (`_n/<token>`).
        string node = 2;
    }
    Lock.LockType lock_type = 3;
}

message Lock {
    enum LockType {
        UNKNOWN = 0;
        NONE = 1;
        READ = 2;
        WRITE = 3;
        CREATE = 4;
    }
}

message NodeLock {
    Lock.LockType lock_type = 1;
    repeated bytes locked_by = 2;
}

// A shard object: the coordination directory (lock table, MVCC current-writer
// index, and key directory) for the keys that map to it. See ADR-017.
message Shard {
    repeated ShardEntry entries = 1;
}

message ShardEntry {
    // Raw user key bytes; also the entry's sort key.
    bytes key = 1;
    // Lock currently held on the key.
    Lock.LockType lock_type = 2;
    // Transactions holding the lock (more than one only for read locks).
    repeated bytes locked_by = 3;
    // Transaction object holding the committed value (the MVCC pointer); empty
    // if the key has no committed value yet.
    bytes current_writer = 4;
    // Tombstone flag.
    bool deleted = 5;
}

// A B-link tree node: the unit of the dynamic, range-partitioned coordination
// directory (ADR-031). It is either a leaf (the per-key coordination entries of
// ADR-017 for a contiguous key range) or an index (separator keys mapping
// ranges to child nodes). The high-key and right-sibling make tree descent
// self-correcting across concurrent splits.
message Node {
    // Exclusive upper bound of the key range this node owns. Empty means
    // +infinity: the rightmost node at its level.
    bytes high_key = 1;
    // Identity token of the right-sibling node at the same level. Empty means
    // none: the rightmost node at its level.
    string right_sibling = 2;
    oneof body {
        // A leaf node: the per-key coordination entries for its range.
        Shard leaf = 3;
        // An index node: separator keys mapping ranges to child nodes.
        IndexNode index = 4;
    }
    NodeLock structure_lock = 5;
    NodeLock membership_lock = 6;
    uint64 membership_version = 7;
    // A transaction preparing collection deletion. Its final status determines
    // whether this is an ignorable abandoned intent or a durable stale-handle
    // fence.
    bytes collection_delete_intent = 8;
}

// A split write-ahead record. It lives at
// `{db}/_s/<participant_id>/<record_id>` until the created nodes are either
// reachable or reclaimed.
message StructuralLog {
    enum Phase {
        PREPARING = 0;
        READY = 1;
    }

    string prefix = 1;
    string source_token = 2;
    string source_version = 3;
    repeated string created_tokens = 4;
    bytes split_key = 5;
    bool is_root = 6;
    // The lifecycle-topology participant that owns this record.
    bytes participant_id = 7;
    Phase phase = 8;
}

// An index node body: an ordered list of separator entries. The child owning a
// key is the last entry whose separator_key is <= the key.
message IndexNode {
    repeated IndexEntry entries = 1;
}

message IndexEntry {
    // Inclusive lower bound of the child's key range; sorted so the encoding is
    // canonical.
    bytes separator_key = 1;
    // Identity token of the child node.
    string child = 2;
}

// Database-level metadata, written once at `{name}/glassdb` when a database is
// first opened. Its presence marks the database as initialized; `version` gates
// on-disk format compatibility. A message (not a bare string) so new metadata
// fields can be added without breaking existing databases.
message DatabaseMetadata {
    // On-disk format version identifier (e.g. "v2").
    string version = 1;
    // Persistent random ID for this logical database. Exactly 16 bytes and
    // mandatory for the v2 format.
    bytes database_id = 2;
}

// Collection metadata stored at `{prefix}/_i` (ADR-050). The B-link tree begins
// independently at `{prefix}/_r`; data-path operations do not read this record.
message CollectionRecord {
    // Direct child bindings, sorted by raw name so the encoding is canonical.
    repeated CollectionDirectoryEntry children = 1;
    // Transactional coordination for the bounded child directory.
    NodeLock directory_lock = 2;
    uint64 directory_version = 3;
    // Collection topology is frozen while this transaction prepares a drop.
    bytes topology_freeze = 4;
    // Structural operations that joined before the freeze was installed.
    repeated bytes topology_participants = 5;
}

message CollectionDirectoryEntry {
    // Raw child name.
    bytes name = 1;
    // Stable 16-byte incarnation ID.
    bytes collection_id = 2;
}

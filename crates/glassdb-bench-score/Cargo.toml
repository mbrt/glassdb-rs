[package]
name = "glassdb-bench-score"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Lightweight, latency-stabilized in-memory benchmarks for glassdb. This crate
# depends only on glassdb's public API (no cloud SDKs), so it builds fast — it
# supplies the backend-operation score used by performance CI and comparison tools.
# The heavier concurrency/throughput benchmarks against real cloud backends live
# in the separate `glassdb-bench-scale` crate.
#
# Binaries:
#   bench-score  the backend-operation scoring harness with one client.
[dependencies]
glassdb = { path = "../glassdb" }
# A tokio runtime drives the single-client workloads.
tokio = { version = "1.52.3", features = ["rt", "macros", "time"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3.32"
# The scoring harness emits/parses JSON scores.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The defaults of perfbench. They are the first layer of every experiment, and
# `--config` files and experiment files change them. The README of this crate
# explains the schema. An experiment selects its workload with `cell.workload`.

[seed]
quiet-period = "10s"
timeout = "180s"

[cell]
collections = "databases"
databases = 4
workers = 8
affinity = 100
gc = true

[cell.warm-up]
minimum = "5s"
quiet = "10s"
quiet-rate = 0.2
timeout = "60s"

[cell.measure]
until = "converged"
duration = "2s"
max-duration = "60s"
window-commits = 50

[package]
name = "glassdb-bench-scale"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Concurrency / throughput "scale" benchmarks for glassdb, run against real or
# simulated cloud backends. This crate pulls in the AWS / GCS SDKs. Controlled
# in-memory diagnostics live in glassdb's Criterion transaction benchmarks.
#
# Binaries:
#   perfbench      mixed, contention, and inline-pressure database scenarios.
#   backendbench  raw backend storage-op latencies (ported from Go
#                 `hack/backendbench`).
[dependencies]
glassdb = { path = "../glassdb", features = ["s3", "gcs", "s3-fake-server"] }
glassdb-backend = { workspace = true }
glassdb-concurr = { workspace = true }
glassdb-data = { workspace = true }
# A real tokio runtime drives the binaries.
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3.32"
async-trait = "0.1.89"
rand = "0.10.1"
# perfbench emits versioned JSON result envelopes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-config = "1.8.17"
# See glassdb-backend-s3: drop the default legacy `rustls` feature to keep the
# vulnerable rustls-webpki 0.101.x (RUSTSEC-2026-0104) out of the build.
aws-sdk-s3 = { version = "1.137.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
# Plaintext HTTP client for the fakes3 backend's connection-pool A/B knob
# (`--http-pool`); the TLS variant for real S3 lives in glassdb-backend-s3.
aws-smithy-http-client = { version = "1.1.13", default-features = false, features = ["default-client"] }
aws-smithy-runtime-api = "1"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

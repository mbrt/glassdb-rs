[package]
name = "glassdb-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Backend trait, in-memory backend, and middleware for GlassDB."
keywords = ["glassdb", "object-storage", "backend", "database"]
categories = ["database-implementations", "asynchronous"]

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
glassdb-concurr = { version = "0.2.0", path = "../glassdb-concurr" }
rand = "0.10.1"
rand_distr = "0.6.0"
thiserror = "2.0.18"
tokio = { version = "1", default-features = false, features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }

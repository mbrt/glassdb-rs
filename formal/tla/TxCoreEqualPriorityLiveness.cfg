\* @verify-formal liveness MC_TxCoreLiveness
CONSTANTS
    T1 = t1
    T2 = t2
    K1 = k1
    K2 = k2
    L1 = l1
    L2 = l2
    PWrite1 = p_write_1
    PWrite2 = p_write_2
    PReadWrite = p_read_write
    PReadOnly = p_read_only
    PValidatedError = p_validated_error
    PAbort = p_abort
    VAbsent = v_absent
    V1 = v1
    V2 = v2
    VTombstone = v_tombstone
    Txns = {t1, t2}
    Keys = {k1, k2}
    Leaves = {l1, l2}
    Values = {v_absent, v1, v2, v_tombstone}
    Programs = {p_write_1}
    NoTx = no_tx
    InitWriter = initial_writer
    NoProgram = no_program
    NoWrite = no_write
    KeyLeaf <- CrossLeafMap
    LeafRank <- LeafRankMap
    Priority <- EqualPriorityMap
    ProgramReads <- PilotReads
    ProgramWrites <- PilotWrites
    ProgramResult <- PilotResults
    InitialDb <- PilotInitialDb
    MaxTime = 0
    LeftTx = t1
    RightTx = t2
    WorkProgram = p_write_1

SPECIFICATION EqualPriorityFairSpec
CHECK_DEADLOCK FALSE

INVARIANTS
    S0_TypeOK
    S4_Refinement
    S9_PostLockValidation

PROPERTY CycleEventuallyUsesSortedFallback

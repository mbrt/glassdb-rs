\* @verify-formal safety MC_RecoveryLifecycle
CONSTANTS
    O1 = o1
    O2 = o2
    A1 = a1
    A1R = a1r
    A2 = a2
    K1 = k1
    K2 = k2
    R0 = r0
    R1 = r1
    Ops = {o1, o2}
    Attempts = {a1, a2}
    Keys = {k1}
    RevisionTokens = {r0, r1}
    NoAttempt = no_attempt
    NoProgress = no_progress
    MaxTime = 2
    PublicOf <- PilotPublicOf
    FirstAttempt <- PilotFirstAttempt
    RenewedAttempt <- NoRenewedAttempt
    Priority <- PilotPriority
    RequiredKey <- PilotRequiredKey
    InitialRevision = r0
    NextRevision <- PilotNextRevision

SPECIFICATION ObserverSpec
CHECK_DEADLOCK FALSE

INVARIANTS
    R0_TypeOK
    R1_TerminalImmutable
    R3_ReceiptsArePhysical
    R5_ExpiryHasObserverEvidence
    R6_PublicEffectAtMostOnce
